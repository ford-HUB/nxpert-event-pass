<h2 mat-dialog-title>{{ reg.eventTitle }}</h2>
<mat-dialog-content class="pass-content">
  <p class="muted">{{ reg.startsAt | date: 'EEE, MMM d y, h:mm a' }}</p>
  <div class="qr-wrap">
    @if (qrDataUrl()) {
      <img [src]="qrDataUrl()" alt="Your entry QR code" width="240" height="240" />
    }
  </div>
  <p class="muted pass-hint">Present this code at the door for check-in.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
  <button mat-flat-button color="primary" (click)="download()">
    <mat-icon>download</mat-icon> Download PNG
  </button>
</mat-dialog-actions>
